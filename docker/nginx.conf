server_tokens off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
  add_header Cache-Control "no-cache" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.run; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://esm.run https://huggingface.co https://*.huggingface.co https://hf.co https://*.hf.co; worker-src 'self' blob:" always;

  # O jogo é uma página única e não usa rotas internas.
  location = / {
    try_files /index.html =404;
  }

  location = /LICENSE {
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    try_files $uri =404;
  }
}
